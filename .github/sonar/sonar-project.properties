sonar.projectKey=jjdevhub
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.sources=src
sonar.scanner.scanAll=true
# docs nie jest kodem produktu i nie wchodzi do mianownika pokrycia
# versions to pliki wersji, nie kod
# bin to wyjście kompilacji
# obj to wyjście kompilacji
# Generated.cs jest kodem wygenerowanym
sonar.exclusions=docs/**,versions/**,**/bin/**,**/obj/**,**/*.Generated.cs

name: branch-name

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - develop
      - release
      - main

permissions: {}

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check branch name
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          head=$(jq -r .head.ref <<< "$pr")
          base=$(jq -r .base.ref <<< "$pr")
          if [[ -z $head || $head == null || -z $base || $base == null ]]; then
            echo "brak głowy albo celu w pull requeście" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/${head}:refs/remotes/origin/${head}" \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/heads/main:refs/remotes/origin/main"
          .github/scripts/check-branch-name.sh --head "$head" --base "$base"

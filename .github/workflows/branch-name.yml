name: branch-name

on:
  pull_request:
    branches:
      - develop
      - release
      - main

permissions: {}

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-branch-name.sh --head "$HEAD_REF" --base "$BASE_REF"

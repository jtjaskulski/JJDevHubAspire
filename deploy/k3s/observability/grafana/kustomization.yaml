apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jjdevhub
resources:
  - grafana.yaml
generatorOptions:
  labels:
    app: grafana
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml=datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yaml=dashboards.yaml
  - name: grafana-dashboards
    files:
      - jjdevhub-uslugi.json=dashboards/jjdevhub-uslugi.json
      - jjdevhub-wersje.json=dashboards/jjdevhub-wersje.json

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: jjdevhub
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    exporters:
      # Odczyt z poda w jjdevhub, 2026-11-04: GET :8889/metrics zwraca 200,
      # Content-Type text/plain; version=0.0.4; charset=utf-8; escaping=underscores,
      # Content-Length 0. W tekście nie ma żadnej serii. Nie ma
      # http_server_active_requests ani histogramu czasu, bo repliki aplikacji są 0.
      # Oczekiwany człon żądań w toku zostaje http_server_active_requests.
      # Pusty zrzut nie uruchamia metricstransform.
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_constant_labels:
          included:
            - service.name
            - service.version
            - deployment.environment
      otlp/jaeger:
        endpoint: jaeger.jjdevhub.svc.cluster.local:4317
        tls:
          insecure: true
      debug:
        verbosity: basic
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: jjdevhub
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          # 0.164.0
          image: otel/opentelemetry-collector@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/otelcol/config.yaml
          ports:
            - name: otlp
              containerPort: 4317
            - name: metrics
              containerPort: 8889
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: jjdevhub
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp
      port: 4317
      targetPort: otlp
    - name: metrics
      port: 8889
      targetPort: metrics

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarqube
  namespace: jjdevhub
  labels:
    app: sonarqube
spec:
  replicas: 1
  serviceName: sonarqube
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: sonarqube
          # 26.10.0.133078-community
          image: sonarqube@sha256:aa0d41212704d1ed35f7ae3b49886b39f639590baf8020cdb191c2a2eb8f9eae
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
            - name: logs
              mountPath: /opt/sonarqube/logs
            - name: temp
              mountPath: /opt/sonarqube/temp
          startupProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 20
      volumes:
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
